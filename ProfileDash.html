<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="ProfileDashStyle.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="ProfileDashScript.js"></script>
  </head>
  <body>
    <a href="Home.html" class="back-button">←</a>
    <div class="dashboard">
      <div class="profile">
        <img
          src="https://randomuser.me/api/portraits/men/1.jpg"
          alt="Profile Picture"
          class="profile-pic"
        />
        <h2>John Miranda</h2>
        <p class="role">Influencer</p>
        <p class="age">Age: 18</p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <h4>Running Ads</h4>
          <p>5</p>
        </div>
        <div class="stat-card">
          <h4>Earnings</h4>
          <p>$1,200</p>
        </div>
        <div class="stat-card">
          <h4>Impressions</h4>
          <p>50K</p>
        </div>
      </div>

      <div class="chart-container">
        <h3>Monthly Earnings</h3>
        <canvas id="earningsChart"></canvas>
      </div>

      <div class="quick-actions">
        <button class="btn primary">Create New Ad</button>
        <button class="btn secondary">Request Collaboration</button>
      </div>
    </div>
  </body>
</html>
